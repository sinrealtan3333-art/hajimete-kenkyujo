name: one-time-child-lab-import

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-original:
    if: ${{ github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[import-child-lab]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import exact original image
        env:
          SOURCE_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-5bcc-8206-b392-cbabd59e7f25/raw?se=2026-09-26T17%3A04%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=12ca4b4e-f053-5302-be51-418615ec775c&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-26T01%3A07%3A47Z&ske=2026-09-27T01%3A07%3A47Z&sks=b&skv=2026-02-06&sig=lBaGw/4KKHCpAEIOWVbLY9a%2BGEkGhEPask1y7YRTBG4%3D'
        run: |
          set -euo pipefail
          mkdir -p assets/labs
          curl --fail --location --retry 2 "$SOURCE_URL" --output assets/labs/child-lab-original.png
          test "$(stat -c%s assets/labs/child-lab-original.png)" = "3342054"
          echo "e60ea72a78978387b52cff64cbb616fa47a62d1b44f359995c87be6196284248  assets/labs/child-lab-original.png" | sha256sum -c -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/labs/child-lab-original.png
          git commit -m "Add original child lab image"
          git push
