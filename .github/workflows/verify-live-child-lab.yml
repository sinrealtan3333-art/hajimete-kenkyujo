name: Verify live child lab image

on:
  push:
    branches: [main]

jobs:
  verify-live:
    if: ${{ contains(github.event.head_commit.message, '[verify-child-lab]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed HTML and exact image bytes
        run: |
          set -euo pipefail
          found=0
          for n in $(seq 1 18); do
            if curl --fail --silent --show-error --location "https://hajimete-kenkyujo.com/?verify=$GITHUB_SHA-$n" -o /tmp/home.html; then
              if grep -Fq '/assets/labs/child-lab-original.png?v=20260927-original' /tmp/home.html; then
                found=1
                break
              fi
            fi
            sleep 5
          done
          test "$found" = "1"
          curl --fail --silent --show-error --location "https://hajimete-kenkyujo.com/assets/labs/child-lab-original.png?verify=$GITHUB_SHA" -o /tmp/child-lab-original.png
          echo "e60ea72a78978387b52cff64cbb616fa47a62d1b44f359995c87be6196284248  /tmp/child-lab-original.png" | sha256sum -c -
