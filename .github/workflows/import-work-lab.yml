name: Import work lab original image

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-work-lab.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original-resolution image
        run: |
          mkdir -p assets/labs
          curl --fail --location --retry 3             'https://media.canva.com/v2/image-resize/format:PNG/height:941/quality:100/uri:ifs%3A%2F%2FM%2F7a02c25e-1935-4b81-bebf-15c21acd8c98/watermark:F/width:1672?csig=AAAAAAAAAAAAAAAAAAAAAEiP33Ob64myBTWi2H_NgHXdWiD7ngfTU6LT8VtYf-xU&exp=1790454893&osig=AAAAAAAAAAAAAAAAAAAAACnKRDZDxrJmgzj7hoRW4QBCdp35wmEP7R2rVh8mIwnH&signer=media-rpc&x-canva-quality=thumbnail'             --output assets/labs/work-lab-original.png
          file assets/labs/work-lab-original.png
          test "$(stat -c%s assets/labs/work-lab-original.png)" -gt 100000
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/labs/work-lab-original.png
          git diff --cached --quiet && exit 0
          git commit -m "Add original work lab image [skip ci]"
          git push
