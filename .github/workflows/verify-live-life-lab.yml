name: Verify live life lab image

on:
  push:
    branches: [main]

jobs:
  verify-live:
    if: ${{ contains(github.event.head_commit.message, '[verify-life-lab]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed HTML and exact image bytes
        run: |
          set -euo pipefail
          found=0
          for n in $(seq 1 18); do
            if curl --fail --silent --show-error --location "https://hajimete-kenkyujo.com/?verify=$GITHUB_SHA-$n" -o /tmp/home.html; then
              if grep -Fq '/assets/labs/life-lab-original.png?v=20260927-original' /tmp/home.html; then
                found=1
                break
              fi
            fi
            sleep 5
          done
          test "$found" = "1"
          curl --fail --silent --show-error --location "https://hajimete-kenkyujo.com/assets/labs/life-lab-original.png?verify=$GITHUB_SHA" -o /tmp/life-lab-original.png
          echo "4246732fadd01be29b8b3c6ae0a1903e4fad8a9e6191f05e0d90f88bc64044b8  /tmp/life-lab-original.png" | sha256sum -c -
